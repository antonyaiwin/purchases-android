name: Publish to GitHub Packages Maven

on:
  push:
    branches:
      - deploy/packages

jobs:
  publish:
    name: Publish Maven Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Publish purchases package to GitHub Packages
        run: ./gradlew :purchases:publishAllPublicationsToGitHubPackagesRepository --no-daemon --no-parallel
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
